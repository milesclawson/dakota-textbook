site_name: Dakhotiyapi — Beginning Dakota Language
site_description: A high school introductory Dakota language course with cultural context from AIS 112
site_author: Dakota Language Program
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Course Description: course-description.md
  - Pronunciation Guide: pronunciation.md
  - Chapters:
    - Overview: chapters/index.md
    - "Chapter 1 — Háu / Haŋ (Greetings & Identity)":
      - Content: chapters/01-hau/index.md
      - Quiz: chapters/01-hau/quiz.md
    - "Chapter 2 — Otóiyohi (Numbers, Colors & Descriptors)":
      - Content: chapters/02-otoyohi/index.md
      - Quiz: chapters/02-otoyohi/quiz.md
    - "Chapter 3 — Wóuŋsipi (Daily Life & Action Verbs)":
      - Content: chapters/03-wounsipe/index.md
      - Quiz: chapters/03-wounsipe/quiz.md
    - "Chapter 4 — Čhaŋté (Body, Health & Relationships)":
      - Content: chapters/04-chante/index.md
      - Quiz: chapters/04-chante/quiz.md
    - "Chapter 5 — Wóčhekiye (Prayer, Values & The Sacred)":
      - Content: chapters/05-wochekiye/index.md
      - Quiz: chapters/05-wochekiye/quiz.md
    - "Chapter 6 — Makóčhe (Land, Seasons & Directions)":
      - Content: chapters/06-makoche/index.md
      - Quiz: chapters/06-makoche/quiz.md
    - "Chapter 7 — Wóoyake (Story, Ceremony & Oral Tradition)":
      - Content: chapters/07-woyake/index.md
      - Quiz: chapters/07-woyake/quiz.md
    - "Chapter 8 — Oyáte (Nation, Treaties & Sovereignty)":
      - Content: chapters/08-oyate/index.md
      - Quiz: chapters/08-oyate/quiz.md
  - Exams:
    - Overview: exams/index.md
    - Mid-Year Exam (Chs 1–4): exams/midyear.md
    - End-of-Year Exam (Chs 5–8): exams/endofyear.md
    - ACTFL Proficiency Scale: exams/actfl.md
  - Games:
    - Hub: games/index.md
    - Word Match: games/word-match.md
    - Number Rain: games/number-rain.md
    - Flashcard Drill: games/flashcard-drill.md
    - Sentence Scramble: games/sentence-scramble.md
    - Tiyóšpaye Defense: games/tiyospaye-defense.md
    - Verb Builder: games/verb-builder.md
  - Glossary: glossary.md
  - Resources: resources.md
  - About: about.md
